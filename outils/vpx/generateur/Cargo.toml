[package]
name = "generateur-vpx"
version = "1.0.0"
edition = "2024"
description = "Fabrique la table Visual Pinball de Fanny Pinball à partir de la géométrie de la version web"
publish = false

[dependencies]
vpin = "=0.41.1"
serde_json = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[profile.release]
opt-level = 2
