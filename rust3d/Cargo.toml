[package]
name = "fanny-pinball-3d"
version = "0.1.0"
edition = "2021"
description = "Version native 3D temps réel (OpenGL 3.3 Core) de Fanny Pinball en Rust"

[dependencies]
sdl2 = { version = "0.37", features = ["image", "mixer"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
